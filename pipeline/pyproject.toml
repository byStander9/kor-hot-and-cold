[project]
name = "kor-hot-and-cold-pipeline"
version = "0.1.0"
description = "한국어 Hot and Cold 데이터 수집·검증·순위 생성 파이프라인"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
verify-sources = "kor_hot_and_cold_pipeline.sources:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kor_hot_and_cold_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

